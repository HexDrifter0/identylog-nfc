<!-- editar_momento.html - Editar vídeo y mensaje -->
{% extends 'nfc_manager/base.html' %}

{% block title %}Editar mi recuerdo{% endblock %}

{% block extra_css %}
<style>
.btn {
    display: inline-block;
    width: 100%;
    padding: 16px 24px;
    background: #4338ca;
    color: #ffffff;
    border: none;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.3s ease;
}
.btn:hover {
    transform: translateY(-2px);
}
.btn-outline {
    background: white;
    color: #1d4ed8;
    border: 2px solid #1d4ed8;
}
</style>
{% endblock %}

{% block content %}
<h2 style="margin-bottom: 24px;">✏️ Editar tu recuerdo</h2>

<form method="POST">
    {% csrf_token %}
    
    <label for="title">🎬 Título (opcional)</label>
    <input id="title" type="text" name="title" value="{{ momento.title }}" placeholder="Ej: Feliz cumpleaños, Ana!">
    
    <label for="youtube_url">📹 URL de YouTube</label>
    <input id="youtube_url" type="url" name="youtube_url" value="{{ momento.youtube_url }}" placeholder="https://www.youtube.com/watch?v=..." required>
    <p style="font-size: 12px; color: #999; margin-top: -12px;">
        💡 Sube tu vídeo a YouTube como "No listado" y pega el enlace aquí
    </p>
    
    <label for="message">💝 Mensaje (opcional)</label>
    <textarea id="message" name="message" rows="4" placeholder="Escribe un mensaje especial...">{{ momento.message }}</textarea>
    
    <label for="recipient_name">👤 Para quién es (opcional)</label>
    <input id="recipient_name" type="text" name="recipient_name" value="{{ momento.recipient_name }}" placeholder="Ej: Para mi hermana">
    
    <button type="submit" class="btn">💾 Guardar cambios</button>
</form>

<a href="{% url 'dashboard' %}" class="btn btn-outline">← Volver a mis recuerdos</a>
{% endblock %}
